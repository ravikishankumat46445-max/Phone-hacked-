<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Phone Locked 😈</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;background:#050505;color:#fff;
font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
.box{padding:25px}.emoji{font-size:65px}h1{color:#ff3333;font-size:30px}
#timer{font-size:55px;font-weight:bold;margin:25px 0}
button{padding:14px 25px;border:0;border-radius:10px;background:#fff;color:#000;font-size:17px}
small{color:#aaa;display:block;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<div class="emoji">🔒😈</div>
<h1>PHONE LOCKED!</h1>
<p>Security prank activated...</p>
<div id="timer">60:00</div>
<button onclick="unlock()">UNLOCK 🔓</button>
<small>⚠️ Don't panic... 😜</small>
</div>
<script>
let seconds=3600;
const countdown=setInterval(()=>{
 let m=Math.floor(seconds/60),s=seconds%60;
 document.getElementById("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
 if(seconds<=0)clearInterval(countdown); seconds--;
},1000);
function unlock(){
 clearInterval(countdown);
 document.body.innerHTML='<div style="text-align:center;font-family:Arial"><div style="font-size:70px">😂</div><h1 style="color:#111">PRANK! 😜</h1><p>Phone bilkul safe hai!</p></div>';
}
</script>
</body>
</html>
